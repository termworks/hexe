name: Release

# Triggered by the tag push from git-rel (`make release`). The release itself
# is created moments later by `gh release create` with git-cliff notes; the
# upload step below attaches artifacts to that existing release. No
# `release: published` trigger: git-rel's release creation runs under the
# user's token and would fire a second, redundant build.
#
# Both tag spellings are matched on purpose: releases through 0.2.11 were
# tagged bare (`0.2.11`), and from 0.2.12 on `veri` started emitting a
# `v` prefix, which silently stopped matching a bare-only pattern and shipped
# two releases with no binaries attached.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Lets an existing tag be rebuilt and its artifacts attached after the fact,
  # without cutting a new version.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach artifacts to (e.g. v0.2.13)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Released binaries are STATIC musl: no dynamic loader, no glibc
          # version to match, so one artifact runs on any Linux of that arch.
          # Zig links its bundled musl statically for every *-linux-musl target,
          # so this needs no extra linkage flag.
          #
          # An older note here claimed musl was impossible because "signal.h
          # SIG_ERR fails translate-c inside libvoid". That was about a BARE
          # "x86_64-linux" target (which resolves to musl implicitly) and no
          # longer reproduces on Zig 0.15.2 + libvoid 0.0.13: an explicit
          # x86_64-linux-musl build was verified locally, with libvoid genuinely
          # linked in (its CapabilityDropFailed symbol is present in the
          # stripped binary, so isolation is not silently compiled out).
          - os: ubuntu-24.04
            target: x86_64-linux-musl
            artifact_name: hexe-x86_64-linux

          # Linux aarch64 (native runner, avoids C cross-compilation issues).
          # musl here is NOT locally verified — there is no arm64 machine to try
          # it on. `fail-fast: false` above means if this one breaks it does not
          # take the x86_64 artifact down with it; fall back to
          # aarch64-linux-gnu if CI rejects it.
          - os: ubuntu-24.04-arm
            target: aarch64-linux-musl
            artifact_name: hexe-aarch64-linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Vendor patched ghostty-vt
        # build.zig.zon points at vendor/ghostty, which is generated rather than
        # committed: it is upstream ghostty at a pinned revision plus
        # patches/ghostty-vt-ns.patch. Without this the build has no dependency
        # to resolve. `make ghostty` also gives it its own .git, which keeps
        # ghostty's version detection from walking up and finding OUR tags.
        run: make ghostty

      - name: Build binary
        env:
          GIT_CEILING_DIRECTORIES: ${{ github.workspace }}/.zig-cache
        run: zig build -Doptimize=ReleaseFast -Dstrip=true -Dtarget=${{ matrix.target }}

      - name: Smoke-test binary
        # Both targets run natively on their runner, so a basic invocation
        # catches a broken artifact before it ships.
        run: zig-out/bin/hexe --help

      - name: Assert the artifact is statically linked
        # The whole point of the musl target is a binary with no glibc
        # dependency. A silently-dynamic artifact would still pass --help here
        # on the runner and only fail on a user's machine, so check it
        # explicitly rather than trusting the target triple.
        run: |
          file zig-out/bin/hexe
          if ! file zig-out/bin/hexe | grep -q "statically linked"; then
            echo "::error::artifact is not statically linked" >&2
            exit 1
          fi
          if ldd zig-out/bin/hexe 2>&1 | grep -qv "not a dynamic executable"; then
            echo "::error::artifact has dynamic dependencies:" >&2
            ldd zig-out/bin/hexe >&2
            exit 1
          fi

      - name: Prepare artifact
        run: |
          mkdir -p dist
          tar -czf dist/${{ matrix.artifact_name }}.tar.gz -C zig-out/bin hexe
          (cd dist && sha256sum ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}.tar.gz
            dist/${{ matrix.artifact_name }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
